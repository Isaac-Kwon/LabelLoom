name: 버그 신고 / Bug report
description: 앱이 잘못 동작하거나 출력물이 화면과 다를 때 / Something is broken or the output does not match the screen
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        신고해 주셔서 감사합니다. 한국어와 English 중 편한 언어로 작성하십시오.
        Thanks for the report. Write in Korean or English, whichever you prefer.

        ⚠️ 명단에 실명·연락처 같은 개인정보가 있으면 첨부하기 전에 지우거나 가짜 값으로 바꾸십시오.
        ⚠️ If your data contains real names or contact details, remove or replace them before attaching.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었습니까? / What happened?
      description: 기대한 동작과 실제 동작을 적어 주십시오. 스크린샷이 있으면 붙여 넣어 주십시오. / What did you expect, and what happened instead? Paste screenshots if you can.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법 / Steps to reproduce
      placeholder: |
        1. 새 프로젝트에서 A4 2×5 명찰 템플릿을 엽니다
        2. 명단.xlsx를 가져옵니다
        3. PDF(벡터)로 내보냅니다
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전 / Version
      description: 화면 오른쪽 아래의 작은 표시나 정보 창에 있습니다. / Shown in the bottom-right corner of the app, or in the About dialog.
      placeholder: v0.3.0 · abc1234 · 2026-10-25 12:00
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 어떻게 열었습니까? / How do you open the app?
      options:
        - GitHub Pages (웹 주소 / website)
        - 내려받은 HTML 파일 / Downloaded HTML file (file://)
        - 설치한 앱(PWA) / Installed app (PWA)
        - 직접 빌드 / Built from source
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 관련 기능 / Area
      multiple: true
      options:
        - 디자인 편집 / Design editor
        - 텍스트 / Text
        - 바코드·QR / Barcodes & QR
        - 이미지·SVG / Images & SVG
        - 용지·셀 분할 / Paper & layout
        - 데이터 가져오기 (xlsx·csv) / Data import
        - 브라우저 인쇄 / Browser print
        - PDF 내보내기 / PDF export
        - PNG·ZIP 내보내기 / PNG & ZIP export
        - 빠른 출력 / Quick print
        - 저장·열기·링크 공유 / Save, open & link sharing
        - 기타 / Other
  - type: input
    id: browser
    attributes:
      label: 브라우저와 운영체제 / Browser and OS
      placeholder: Chrome 141, Windows 11
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: 프린터·라벨지 (인쇄 문제일 때) / Printer & label stock (for print issues)
      placeholder: Brother QL-820NWB, 62 mm 롤 / Epson L3150, A4 2×5 명찰지
  - type: textarea
    id: files
    attributes:
      label: 첨부 / Attachments
      description: 문제가 생기는 `.labelloom.json`(또는 데이터를 뺀 디자인 저장), 출력 PDF 등을 끌어다 놓으십시오. / Drag in the `.labelloom.json` (or a design-only save), the exported PDF, etc.
